<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>NexusMind Clipper 设置</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 14px 0 4px; font-size: 14px; }
    input { width: 100%; padding: 8px; border: 1px solid #d5dbe7; border-radius: 8px; }
    button { margin-top: 16px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; }
    p.hint { color: #667085; font-size: 13px; }
  </style>
</head>
<body>
  <h1>NexusMind Web Clipper 设置</h1>
  <label>本地服务地址 <input id="serverUrl" type="text" /></label>
  <label>API Token（当服务端设置了 NEXUSMIND_API_TOKEN 时必填） <input id="apiToken" type="text" /></label>
  <label>作者署名 <input id="author" type="text" /></label>
  <button id="save">保存</button>
  <p class="hint" id="status"></p>
  <p class="hint">默认连接本机 http://127.0.0.1:8301。若通过局域网/隧道访问其他机器上的 NexusMind，请改成对应地址并填写 Token。</p>
  <script src="clipper.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const cfg = await getConfig();
      document.getElementById("serverUrl").value = cfg.serverUrl;
      document.getElementById("apiToken").value = cfg.apiToken;
      document.getElementById("author").value = cfg.author;
      document.getElementById("save").addEventListener("click", async () => {
        await chrome.storage.local.set({
          serverUrl: document.getElementById("serverUrl").value.trim() || DEFAULTS.serverUrl,
          apiToken: document.getElementById("apiToken").value.trim(),
          author: document.getElementById("author").value.trim() || DEFAULTS.author,
        });
        document.getElementById("status").textContent = "已保存";
      });
    });
  </script>
</body>
</html>
