[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusmind"
version = "0.2.0"
description = "NexusMind: Agent + Obsidian Self-Growing Knowledge Operating System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NexusMind Contributors"}
]
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
nexusmind = "nexusmind.cli.main:main"
nexusmind-agent = "nexusmind.agent.main:main"

[project.optional-dependencies]
local = [
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]
agent = [
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "PySide6>=6.6,<7; sys_platform != 'darwin'",
    "PySide6==6.8.3; sys_platform == 'darwin'",
]
build = [
    "pyinstaller>=6.10,<6.17",
    "Pillow>=10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[dependency-groups]
cloudflare = [
    "workers-py; python_version >= '3.13'",
    "workers-runtime-sdk; python_version >= '3.13'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexusmind = ["web/*", "web/**/*", "agent/assets/*"]
