name: Build Local Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "agent-v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: agent-windows-x64
            asset: NexusMindAgent-Windows-x64.exe
          - os: ubuntu-latest
            artifact: agent-linux-x64
            asset: NexusMindAgent-Linux-x64
          - os: macos-15-intel
            artifact: agent-macos-intel-x64
            asset: NexusMindAgent-macOS-Intel-x64.dmg
            expected_arch: x86_64
          - os: macos-latest
            artifact: agent-macos-apple-silicon-arm64
            asset: NexusMindAgent-macOS-AppleSilicon-arm64.dmg
            expected_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install ".[agent,build]"

      - name: Build Agent
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '12.0' || '' }}
        run: python packaging/build_agent.py

      - name: Verify packaged runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:NEXUSMIND_HOST = "127.0.0.1"
          $env:NEXUSMIND_PORT = "18301"
          $expected = python -c "import nexusmind; print(nexusmind.__version__)"
          $process = Start-Process -FilePath "dist\NexusMindAgent.exe" -ArgumentList "--api-service" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:18301/health" -TimeoutSec 2
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw "Packaged API did not start" }
            if ($health.version -ne $expected) {
              throw "Packaged version mismatch: expected $expected, got $($health.version)"
            }
            $appJs = (Invoke-WebRequest "http://127.0.0.1:18301/app.js" -UseBasicParsing).Content
            if ($appJs -notmatch "webTab" -or $appJs -notmatch "submitWebIngest") {
              throw "Packaged Web UI is missing current online-ingest features"
            }
            $uiJs = Invoke-WebRequest "http://127.0.0.1:18301/ui.js" -UseBasicParsing
            if ($uiJs.StatusCode -ne 200) { throw "Packaged ui.js is unavailable" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Verify packaged runtime on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export NEXUSMIND_HOST=127.0.0.1
          export NEXUSMIND_PORT=18301
          expected="$(python -c 'import nexusmind; print(nexusmind.__version__)')"
          ./dist/NexusMindAgent --api-service > /tmp/nexusmind-agent.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18301/health > /tmp/nexusmind-health.json && break
            sleep 0.5
          done
          python -c 'import json,sys; d=json.load(open("/tmp/nexusmind-health.json")); expected=sys.argv[1]; assert d["version"] == expected, (d["version"], expected)' "$expected"
          curl -fsS http://127.0.0.1:18301/app.js > /tmp/nexusmind-app.js
          grep -q 'webTab' /tmp/nexusmind-app.js
          grep -q 'submitWebIngest' /tmp/nexusmind-app.js
          curl -fsS http://127.0.0.1:18301/ui.js > /dev/null

      - name: Verify packaged runtime on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export NEXUSMIND_HOST=127.0.0.1
          export NEXUSMIND_PORT=18301
          expected="$(python -c 'import nexusmind; print(nexusmind.__version__)')"
          ./dist/NexusMindAgent.app/Contents/MacOS/NexusMindAgent --api-service > /tmp/nexusmind-agent.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18301/health > /tmp/nexusmind-health.json && break
            sleep 0.5
          done
          python -c 'import json,sys; d=json.load(open("/tmp/nexusmind-health.json")); expected=sys.argv[1]; assert d["version"] == expected, (d["version"], expected)' "$expected"
          curl -fsS http://127.0.0.1:18301/app.js > /tmp/nexusmind-app.js
          grep -q 'webTab' /tmp/nexusmind-app.js
          grep -q 'submitWebIngest' /tmp/nexusmind-app.js
          curl -fsS http://127.0.0.1:18301/ui.js > /dev/null

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist\NexusMindAgent.exe "dist\${{ matrix.asset }}"

      - name: Prepare Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mv dist/NexusMindAgent "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Verify macOS architecture and create DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ARCH="$(uname -m)"
          EXPECTED_ARCH="${{ matrix.expected_arch }}"
          echo "Runner architecture: $ACTUAL_ARCH"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          file dist/NexusMindAgent.app/Contents/MacOS/NexusMindAgent

          echo "Checking minimum macOS versions in bundled Mach-O files..."
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q "Mach-O"; then
              while IFS= read -r minos; do
                [ -z "$minos" ] && continue
                python3 -c 'import sys; path,minos=sys.argv[1],sys.argv[2]; parts=tuple(int(x) for x in minos.split(".")); sys.exit(f"{path}: minimum macOS {minos} exceeds supported target 12.0" if parts > (12,0) else 0)' "$candidate" "$minos"
              done < <(vtool -show-build "$candidate" 2>/dev/null | awk '/minos/{print $2}')
            fi
          done < <(find dist/NexusMindAgent.app -type f -print0)

          codesign --force --deep --sign - dist/NexusMindAgent.app
          codesign --verify --deep --strict --verbose=2 dist/NexusMindAgent.app

          mkdir -p dmg-root
          cp -R dist/NexusMindAgent.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "NexusMind Agent" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/${{ matrix.asset }}"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, docker]
    runs-on: ubuntu-latest

    steps:
      - name: Download Agent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: release-input

      - name: Collect flat release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-input -mindepth 2 -maxdepth 2 -type f -exec cp {} release-assets/ \;
          cd release-assets
          test -f NexusMindAgent-Windows-x64.exe
          test -f NexusMindAgent-Linux-x64
          test -f NexusMindAgent-macOS-Intel-x64.dmg
          test -f NexusMindAgent-macOS-AppleSilicon-arm64.dmg
          ls -lh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="NexusMind ${TAG#v}"
          NOTES=$'NexusMind '"${TAG#v}"$'\n\nAgent downloads:\n- Windows x64: NexusMindAgent-Windows-x64.exe\n- Linux x64: NexusMindAgent-Linux-x64\n- macOS Intel x64 (macOS 12 Monterey+): NexusMindAgent-macOS-Intel-x64.dmg\n- macOS Apple Silicon (M-series) arm64 (macOS 12 Monterey+): NexusMindAgent-macOS-AppleSilicon-arm64.dmg\n\nDocker image (amd64 + arm64):\n```bash\ndocker pull ghcr.io/'"${GH_REPO}"':'"${TAG}"$'\n```\n\nAlso published as `ghcr.io/'"${GH_REPO}"':'"${TAG#v}"$'` and `ghcr.io/'"${GH_REPO}"':latest` for stable releases.'

          if gh release view "$TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" --yes
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" release-assets/*
          else
            gh release create "$TAG" \
              release-assets/* \
              --title "$TITLE" \
              --notes "$NOTES" \
              --verify-tag
          fi
