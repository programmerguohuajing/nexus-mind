name: Build Local Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "agent-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: agent-windows-x64
            asset: NexusMindAgent-Windows-x64.exe
          - os: ubuntu-latest
            artifact: agent-linux-x64
            asset: NexusMindAgent-Linux-x64
          - os: macos-15-intel
            artifact: agent-macos-intel-x64
            asset: NexusMindAgent-macOS-Intel-x64.dmg
            expected_arch: x86_64
          - os: macos-latest
            artifact: agent-macos-apple-silicon-arm64
            asset: NexusMindAgent-macOS-AppleSilicon-arm64.dmg
            expected_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install ".[agent,build]"

      - name: Build Agent
        run: python packaging/build_agent.py

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist\NexusMindAgent.exe "dist\${{ matrix.asset }}"

      - name: Prepare Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mv dist/NexusMindAgent "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Verify macOS architecture and create DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ARCH="$(uname -m)"
          EXPECTED_ARCH="${{ matrix.expected_arch }}"
          echo "Runner architecture: $ACTUAL_ARCH"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          file dist/NexusMindAgent.app/Contents/MacOS/NexusMindAgent
          mkdir -p dmg-root
          cp -R dist/NexusMindAgent.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "NexusMind Agent" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/${{ matrix.asset }}"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Agent artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Collect flat release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-input -mindepth 2 -maxdepth 2 -type f -exec cp {} release-assets/ \;
          cd release-assets
          test -f NexusMindAgent-Windows-x64.exe
          test -f NexusMindAgent-Linux-x64
          test -f NexusMindAgent-macOS-Intel-x64.dmg
          test -f NexusMindAgent-macOS-AppleSilicon-arm64.dmg
          ls -lh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="NexusMind ${TAG#v}"
          NOTES=$'NexusMind '"${TAG#v}"$'\n\nAgent downloads:\n- Windows x64: NexusMindAgent-Windows-x64.exe\n- Linux x64: NexusMindAgent-Linux-x64\n- macOS Intel x64: NexusMindAgent-macOS-Intel-x64.dmg\n- macOS Apple Silicon (M-series) arm64: NexusMindAgent-macOS-AppleSilicon-arm64.dmg'

          if gh release view "$TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" --yes
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" release-assets/*
          else
            gh release create "$TAG" \
              release-assets/* \
              --title "$TITLE" \
              --notes "$NOTES" \
              --verify-tag
          fi
